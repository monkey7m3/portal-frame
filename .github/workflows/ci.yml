name: CI

# Build the debug APK, run JVM unit tests, and run static analysis (Android Lint +
# detekt + ktlint) on every push and pull request, so a broken build, a failing test,
# or a new lint/style regression is caught before it lands. The signed release build
# lives in release.yml (tag pushes only) and needs no secrets here.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

# Cancel an in-progress run when newer commits land on the same ref (and avoid a
# duplicate run when a push and its pull_request would both fire).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate the KtLint baseline from the unmodified main-branch source, not
      # from this feature branch (which would silently baseline newly introduced issues).
      - name: Checkout KtLint baseline source
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-source

      - name: Move KtLint baseline source outside workspace
        if: ${{ github.ref != 'refs/heads/main' && !hashFiles('app/config/ktlint/baseline.xml') }}
        run: mv baseline-source "$RUNNER_TEMP/baseline-source"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` SDK package has been retired. Gradle downloads
          # the compile/build platform packages declared by the Android project.
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Build debug APK + run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Generate inherited KtLint baseline
        if: ${{ github.ref != 'refs/heads/main' && !hashFiles('app/config/ktlint/baseline.xml') }}
        run: |
          # Reuse the feature branch's KtLint baseline configuration while running
          # the baseline task against main's original Kotlin source.
          cp app/build.gradle.kts "$RUNNER_TEMP/baseline-source/app/build.gradle.kts"
          chmod +x "$RUNNER_TEMP/baseline-source/gradlew"
          (
            cd "$RUNNER_TEMP/baseline-source"
            ./gradlew ktlintGenerateBaseline -x ktlintKotlinScriptCheck --no-daemon --stacktrace
          )
          mkdir -p app/config/ktlint
          cp "$RUNNER_TEMP/baseline-source/app/config/ktlint/baseline.xml" app/config/ktlint/baseline.xml
          test -s app/config/ktlint/baseline.xml
          # Keep the baseline checkout outside the workspace so KtLint cannot
          # discover or scan its Gradle scripts during feature-branch analysis.
          rm -rf "$RUNNER_TEMP/baseline-source"

      - name: Remap inherited KtLint baseline to current source lines
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          # KtLint baselines use line numbers. Keep an inherited finding only when
          # its original main-branch source line is unchanged, and move it to that
          # line's current location. Edited/new lines remain subject to KtLint.
          git fetch origin main --depth=1
          python3 remap_ktlint_baseline.py app/config/ktlint/baseline.xml

      - name: Static analysis (Android Lint, detekt, ktlint)
        run: ./gradlew lintDebug detekt ktlintCheck --no-daemon --stacktrace

      - name: Upload lint/analysis reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/config/ktlint/baseline.xml
          if-no-files-found: ignore

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
